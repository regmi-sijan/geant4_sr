name: Cloud calorimeter simulation

on:
  workflow_dispatch:
    inputs:
      chunk_index:
        description: Chunk number (rerun the same number after an interruption)
        required: true
        default: "0"
      events_per_chunk:
        description: Events in this independently saved chunk
        required: true
        default: "25"
      base_seed:
        description: Base random seed; each chunk derives its own seed
        required: true
        default: "12345"

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build cached simulation image
        uses: docker/build-push-action@v6
        with:
          context: cloud-pipeline
          file: cloud-pipeline/.devcontainer/Dockerfile
          load: true
          tags: pythia-geant4-cloud:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PYTHIA and Geant4
        env:
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EVENTS: ${{ inputs.events_per_chunk }}
          BASE_SEED: ${{ inputs.base_seed }}
        run: |
          event_offset=$((CHUNK_INDEX * EVENTS))
          seed=$((BASE_SEED + CHUNK_INDEX))
          if (( seed > 900000000 )); then
            echo "Derived seed exceeds PYTHIA's maximum" >&2
            exit 2
          fi
          docker run --rm \
            -e EVENTS -e CHUNK_INDEX \
            -e EVENT_OFFSET="$event_offset" -e SEED="$seed" \
            -v "$PWD/cloud-pipeline:/workspace" \
            -w /workspace \
            pythia-geant4-cloud:local \
            bash scripts/run_pipeline.sh

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: calorimeter-chunk-${{ inputs.chunk_index }}-run-${{ github.run_number }}
          path: cloud-pipeline/output/chunks/chunk_*/
          if-no-files-found: error
          retention-days: 30
