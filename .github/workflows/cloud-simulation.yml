name: Cloud calorimeter simulation

on:
  workflow_dispatch:
    inputs:
      events:
        description: Number of PYTHIA events
        required: true
        default: "100"
      seed:
        description: PYTHIA random seed
        required: true
        default: "12345"

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build cached simulation image
        uses: docker/build-push-action@v6
        with:
          context: cloud-pipeline
          file: cloud-pipeline/.devcontainer/Dockerfile
          load: true
          tags: pythia-geant4-cloud:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PYTHIA and Geant4
        env:
          EVENTS: ${{ inputs.events }}
          SEED: ${{ inputs.seed }}
        run: |
          docker run --rm \
            -e EVENTS -e SEED \
            -v "$PWD/cloud-pipeline:/workspace" \
            -w /workspace \
            pythia-geant4-cloud:local \
            bash scripts/run_pipeline.sh

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: calorimeter-results-${{ github.run_number }}
          path: cloud-pipeline/output/
          retention-days: 14
